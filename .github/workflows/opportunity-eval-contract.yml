name: APEX Opportunity-Evaluation Contract Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/guard_opportunity_evaluation.py'
      - 'tests/test_opportunity_evaluation_guard.py'
      - 'scripts/guard_nfl_outcome_maturity.py'
      - '.github/workflows/opportunity-eval-contract.yml'
permissions:
  contents: read
jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure post-draft actual round is NEVER treated as a pre-draft forecasting benchmark
        run: python -m unittest discover -s tests -p 'test_opportunity_evaluation_guard.py' -v
