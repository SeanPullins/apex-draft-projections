name: APEX Mobile Real Browser Audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app.js'
      - 'mobile-app.css'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'fan-ux-polish.css'
      - 'scripts/test_mobile_browser.cjs'
      - '.github/workflows/mobile-browser-audit.yml'
permissions:
  contents: read
jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Chrome and start local static server
        run: |
          command -v google-chrome || command -v chromium
          python3 -m http.server 8123 --bind 127.0.0.1 &
          sleep 2
          curl -fsSI http://127.0.0.1:8123/index.html
      - name: Verify actual Chromium viewports 320–481px
        run: node scripts/test_mobile_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-mobile-real-browser-measurements
          path: mobile-browser-artifacts/
          if-no-files-found: warn
          retention-days: 3
